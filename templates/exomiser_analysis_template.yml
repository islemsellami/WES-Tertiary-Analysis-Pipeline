# Exomiser 14 analysis template. Replace the placeholders (<...>) before running.
---
analysis:
  genomeAssembly: hg38
  vcf: <path/to/annotated_with_chr_prefix.vcf>
  ped:
  proband:
  hpoIds: ['HP:XXXXXXX', 'HP:XXXXXXX']        # all HPO terms of the patient
  inheritanceModes: {
    AUTOSOMAL_DOMINANT: 0.1,
    AUTOSOMAL_RECESSIVE_HOM_ALT: 0.1,
    AUTOSOMAL_RECESSIVE_COMP_HET: 2.0
  }
  analysisMode: PASS_ONLY
  frequencySources: [
    UK10K,
    GNOMAD_E_AFR, GNOMAD_E_AMR, GNOMAD_E_EAS, GNOMAD_E_NFE, GNOMAD_E_SAS,
    GNOMAD_G_AFR, GNOMAD_G_AMR, GNOMAD_G_EAS, GNOMAD_G_NFE, GNOMAD_G_SAS
  ]
  pathogenicitySources: [REVEL, MVP]            # CADD is not configured in this setup
  steps: [
    hiPhivePrioritiser: {},
    variantEffectFilter: {remove: [SYNONYMOUS_VARIANT, INTRON_VARIANT, INTERGENIC_VARIANT, UPSTREAM_GENE_VARIANT, DOWNSTREAM_GENE_VARIANT]},
    frequencyFilter: {maxFrequency: 1.0},
    pathogenicityFilter: {keepNonPathogenic: true},
    inheritanceFilter: {},
    omimPrioritiser: {}
  ]
outputOptions:
  outputContributingVariantsOnly: false
  numGenes: 20
  outputPrefix: <output_dir>/<sample>-exomiser
  outputFormats: [TSV_GENE, TSV_VARIANT, HTML]
